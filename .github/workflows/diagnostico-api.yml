name: Diagnostico API CMF

on:
  workflow_dispatch:

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnosticar calls da API CMF
        env:
          CMF_API_TOKEN: ${{ secrets.CMF_API_TOKEN }}
        run: |
          node <<'NODE'
          const token = process.env.CMF_API_TOKEN;
          if (!token) {
            throw new Error('CMF_API_TOKEN nao definido');
          }

          const base = 'https://www.cmf.sc.gov.br/jsonweb/web-aplicativo.php';
          const tests = [
            { call: 'proposicoes', tipo: 'Projetos-de-Leis-ordinarias', pagina: '1' },
            { call: 'pautas', pagina: '1' },
            { call: 'sessoes', pagina: '1' },
            { call: 'sessoes_plenarias', pagina: '1' },
            { call: 'agenda', pagina: '1' },
            { call: 'comissoes', pagina: '1' },
            { call: 'reunioes', pagina: '1' },
            { call: 'vereadores', pagina: '1' },
            { call: 'materias', pagina: '1' },
          ];

          function compact(value) {
            if (value == null) return value;
            if (Array.isArray(value)) return value.slice(0, 2).map(compact);
            if (typeof value === 'object') {
              return Object.fromEntries(
                Object.entries(value)
                  .slice(0, 12)
                  .map(([k, v]) => [k, typeof v === 'string' ? v.slice(0, 180) : compact(v)])
              );
            }
            if (typeof value === 'string') return value.slice(0, 180);
            return value;
          }

          for (const test of tests) {
            const params = new URLSearchParams({ keysoft: token, call: test.call });
            if (test.tipo) params.set('tipo', test.tipo);
            if (test.pagina) params.set('pagina', test.pagina);
            const url = base + '?' + params;
            const resp = await fetch(url, {
              headers: {
                Accept: 'application/json',
                'User-Agent': 'MonitorLegislativo-Diagnostico/1.0 (+contato: tramitacao@monitorlegislativo.com.br)',
              },
              signal: AbortSignal.timeout(30000),
            });
            const text = await resp.text();
            let parsed = null;
            let parseError = '';
            try {
              parsed = text.trim() ? JSON.parse(text) : null;
            } catch (err) {
              parseError = String(err.message || err);
            }
            const count = Array.isArray(parsed) ? parsed.length : (parsed && typeof parsed === 'object' ? Object.keys(parsed).length : 0);
            const keys = Array.isArray(parsed) && parsed[0] && typeof parsed[0] === 'object'
              ? Object.keys(parsed[0])
              : parsed && typeof parsed === 'object'
                ? Object.keys(parsed)
                : [];
            console.log('CALL', test.call, JSON.stringify({
              status: resp.status,
              bytes: text.length,
              parsedType: Array.isArray(parsed) ? 'array' : typeof parsed,
              count,
              keys,
              parseError,
              sample: compact(Array.isArray(parsed) ? parsed.slice(0, 1) : parsed),
            }));
          }

          const pautaId = '2764';
          const pautaUrlId = '2764';
          const detailTests = [
            { call: 'pautas', id: pautaId },
            { call: 'pautas', codigo: pautaId },
            { call: 'pautas', cod: pautaId },
            { call: 'pautas', documento: pautaId },
            { call: 'pautas', pauta: pautaId },
            { call: 'pautas', pauta_id: pautaId },
            { call: 'pautas', id_pauta: pautaId },
            { call: 'pautas', pagina: '1', id: pautaId },
            { call: 'pauta', id: pautaId },
            { call: 'pauta', codigo: pautaId },
            { call: 'pautas_itens', id: pautaId },
            { call: 'itens_pauta', id: pautaId },
            { call: 'itens-pauta', id: pautaId },
            { call: 'item_pauta', id: pautaId },
            { call: 'itenspauta', id: pautaId },
            { call: 'pautasitens', id: pautaId },
            { call: 'pauta_itens', id: pautaId },
            { call: 'pauta-item', id: pautaId },
            { call: 'materias_pauta', id: pautaId },
            { call: 'proposicoes_pauta', id: pautaId },
            { call: 'proposicoes', pauta: pautaId },
            { call: 'proposicoes', pauta_id: pautaId },
            { call: 'proposicoes', id_pauta: pautaId },
            { call: 'proposicoes', id_pauta: pautaUrlId, pagina: '1' },
            { call: 'projetos_pauta', id: pautaId },
            { call: 'pauta_detalhe', id: pautaId },
            { call: 'pautas_detalhe', id: pautaId },
            { call: 'detalhe_pauta', id: pautaId },
            { call: 'detalhes_pauta', id: pautaId },
            { call: 'documentos_pauta', id: pautaId },
            { call: 'reuniao', id: pautaId },
            { call: 'reunioes', id: pautaId },
            { call: 'reuniao_pauta', id: pautaId },
            { call: 'reunioes_pauta', id: pautaId },
            { call: 'comissao_pauta', id: pautaId },
            { call: 'comissoes_pauta', id: pautaId },
            { call: 'sessoes_pauta', id: pautaId },
            { call: 'sessao_pauta', id: pautaId },
            { call: 'tramites', id: pautaId },
            { call: 'tramitacoes', id: pautaId },
          ];

          for (const test of detailTests) {
            const params = new URLSearchParams({ keysoft: token, ...test });
            const resp = await fetch(base + '?' + params, {
              headers: {
                Accept: 'application/json',
                'User-Agent': 'MonitorLegislativo-Diagnostico/1.0 (+contato: tramitacao@monitorlegislativo.com.br)',
              },
              signal: AbortSignal.timeout(30000),
            });
            const text = await resp.text();
            let parsed = null;
            let parseError = '';
            try {
              parsed = text.trim() ? JSON.parse(text) : null;
            } catch (err) {
              parseError = String(err.message || err);
            }
            const count = Array.isArray(parsed) ? parsed.length : (parsed && typeof parsed === 'object' ? Object.keys(parsed).length : 0);
            const keys = Array.isArray(parsed) && parsed[0] && typeof parsed[0] === 'object'
              ? Object.keys(parsed[0])
              : parsed && typeof parsed === 'object'
                ? Object.keys(parsed)
                : [];
            console.log('DETAIL', JSON.stringify(test), JSON.stringify({
              status: resp.status,
              bytes: text.length,
              parsedType: Array.isArray(parsed) ? 'array' : typeof parsed,
              count,
              keys,
              parseError,
              sample: compact(Array.isArray(parsed) ? parsed.slice(0, 1) : parsed),
              rawStart: text.slice(0, 120),
            }));
          }

          const pautaUrl = 'https://www.cmf.sc.gov.br/pautas/0/0/0/0/2764#pesquisa';
          const detailResp = await fetch(pautaUrl, {
            headers: {
              'User-Agent': 'MonitorLegislativo-Diagnostico/1.0 (+contato: tramitacao@monitorlegislativo.com.br)',
            },
            signal: AbortSignal.timeout(30000),
          });
          const detailText = await detailResp.text();
          console.log('HTML_DETAIL', JSON.stringify({
            status: detailResp.status,
            bytes: detailText.length,
            botVerification: /Bot Verification|recaptcha|not a robot/i.test(detailText),
            title: (detailText.match(/<title[^>]*>(.*?)<\/title>/is) || [null, ''])[1].replace(/\s+/g, ' ').trim().slice(0, 160),
            hasProjectPattern: /\b[A-Z]{2,5}-?\d{2,5}-?\d{4}\b|Projeto de Lei|REQUERIMENTO|MOÇÃO|INDICAÇÃO/i.test(detailText),
            rawStart: detailText.slice(0, 160),
          }));
          NODE
